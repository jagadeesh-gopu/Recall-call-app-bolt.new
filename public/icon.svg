<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Top Gloss Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Accent Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" />

  <!-- Top Curved Glass Gloss -->
  <path d="M 16 128 C 16 64, 64 16, 128 16 L 384 16 C 448 16, 496 64, 496 128 C 496 190, 410 240, 256 240 C 102 240, 16 190, 16 128 Z" fill="url(#glossGrad)" />

  <!-- Central Brain / Memory Circuit + Phone Icon Graphic -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Circuit Connections Behind -->
    <path d="M 60 150 L 100 150 M 200 150 L 240 150" stroke="#DDD6FE" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
    <path d="M 150 60 L 150 100 M 150 200 L 150 240" stroke="#DDD6FE" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
    <circle cx="60" cy="150" r="10" fill="#DDD6FE" />
    <circle cx="240" cy="150" r="10" fill="#DDD6FE" />
    <circle cx="150" cy="60" r="10" fill="#DDD6FE" />
    <circle cx="150" cy="240" r="10" fill="#DDD6FE" />

    <!-- Brain Outline Left Hemisphere -->
    <path d="M 140 75 
             C 105 75, 75 105, 75 140 
             C 75 152, 80 162, 88 170 
             C 78 180, 75 195, 80 210 
             C 86 226, 102 235, 120 235 
             C 128 235, 136 232, 140 228" 
          fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Brain Outline Right Hemisphere -->
    <path d="M 160 75 
             C 195 75, 225 105, 225 140 
             C 225 152, 220 162, 212 170 
             C 222 180, 225 195, 220 210 
             C 214 226, 198 235, 180 235 
             C 172 235, 164 232, 160 228" 
          fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Internal Neural Nodes -->
    <circle cx="115" cy="135" r="9" fill="#FFFFFF" />
    <circle cx="185" cy="135" r="9" fill="#FFFFFF" />
    <circle cx="150" cy="150" r="12" fill="#FFFFFF" />
    <circle cx="120" cy="190" r="8" fill="#FFFFFF" />
    <circle cx="180" cy="190" r="8" fill="#FFFFFF" />

    <!-- Neural Interconnections -->
    <path d="M 115 135 L 150 150 L 185 135" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <path d="M 120 190 L 150 150 L 180 190" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <path d="M 150 100 L 150 150" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Sparkle Accent Top Right -->
  <path d="M 390 100 Q 405 100, 405 85 Q 405 100, 420 100 Q 405 100, 405 115 Q 405 100, 390 100 Z" fill="#FFFFFF" opacity="0.9" />
  <!-- Sparkle Accent Bottom Left -->
  <path d="M 95 385 Q 105 385, 105 375 Q 105 385, 115 385 Q 105 385, 105 395 Q 105 385, 95 385 Z" fill="#DDD6FE" opacity="0.8" />
</svg>
